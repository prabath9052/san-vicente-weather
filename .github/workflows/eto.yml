name: Daily ET0 alert (08:00 Argentina)
# 08:00 local = 11:00 UTC. GitHub cron runs late, so early runs (07:00 / 07:25 local) sleep until 08:00, refresh station data, then send;
# backup runs later in the morning. Own concurrency group (the station group's pending slot would cancel it). private/etoState.lastSentDate makes it send exactly once per day.
# alertsLog is shared with the station job: fs_sync.py merges it and writes with a Firestore precondition (no lost entries).
on:
  schedule:
    - cron: '0 10 * * *'    # 07:00 local: waits until 08:00, then sends
    - cron: '25 10 * * *'   # 07:25 local: backup early run (queued behind the first; skips if already sent)
    - cron: '20 11 * * *'   # 08:20 local: late backups
    - cron: '0 12 * * *'    # 09:00 local
    - cron: '0 13 * * *'    # 10:00 local
  workflow_dispatch:
    inputs:
      test:
        description: 'TEST: send ONE push to prabath9052 + ONE summary email to MAIL_FROM (no state, no log)'
        type: boolean
        default: true
      test_to:
        description: 'TEST summary email recipient (empty = MAIL_FROM)'
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: eto
  cancel-in-progress: false
jobs:
  eto:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: pip install -q pywebpush matplotlib
      - name: Wait until 08:00 local (11:00 UTC)
        if: github.event_name == 'schedule'
        run: |
          T=$(date -u -d 'today 11:00' +%s); N=$(date -u +%s)
          if [ $N -lt $T ] && [ $((T-N)) -le 4800 ]; then echo "sleeping $((T-N)) s"; while [ $(date -u +%s) -lt $T ]; do sleep 20; done; fi
          date -u
      - name: Fetch latest station data, send ET0, save state
        env:
          HOBOLINK_API_TOKEN: ${{ secrets.HOBOLINK_API_TOKEN }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          FB_BOT_EMAIL: ${{ secrets.FB_BOT_EMAIL }}
          FB_BOT_PASSWORD: ${{ secrets.FB_BOT_PASSWORD }}
          TEST: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.test == 'true' && '1' || '' }}
        run: |
          python3 -u scripts/fs_pull.py
          python3 -u scripts/fetch_station.py || echo "station fetch failed (using stored data)"
          python3 -u scripts/eto_daily.py
          [ -z "$TEST" ] && ONLY_DOCS=etoState,alertsLog python3 -u scripts/fs_sync.py || true
      - name: Daily station summary email (never blocks the push)
        if: always()
        continue-on-error: true
        env:
          FB_BOT_EMAIL: ${{ secrets.FB_BOT_EMAIL }}
          FB_BOT_PASSWORD: ${{ secrets.FB_BOT_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          TEST_TO: ${{ github.event.inputs.test_to }}
          TEST: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.test == 'true' && '1' || '' }}
        run: |
          python3 -u scripts/daily_summary.py
          [ -z "$TEST" ] && ONLY_DOCS=etoState python3 -u scripts/fs_sync.py || true
