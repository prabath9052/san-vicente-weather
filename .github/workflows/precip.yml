name: Update precipitation grid
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: precip
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install requests
      - run: python -u scripts/fetch_precip.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data/precip.json
          git diff --cached --quiet && exit 0
          git commit -m "Update precipitation grid"
          for i in 1 2 3 4 5; do git pull --rebase && git push && exit 0; sleep $((i*7)); done; exit 1
