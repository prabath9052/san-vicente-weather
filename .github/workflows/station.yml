name: Update station current conditions
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: station
  cancel-in-progress: true
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch station
        env:
          HOBOLINK_API_TOKEN: ${{ secrets.HOBOLINK_API_TOKEN }}
        run: python3 -u scripts/fetch_station.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data/station.json data/station-series.json
          git diff --cached --quiet && exit 0
          git commit -m "Update station conditions"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs && git push && exit 0
            sleep $((i*7))
          done
          exit 1
