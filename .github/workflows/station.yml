name: Update station current conditions
# GitHub delays */15 schedules (measured 21-51 min gaps), so each run keeps polling
# HOBOlink for ~27 min and commits every new reading (station logs/uploads every 10 min).
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      force_threshold:
        description: 'TEST: send if wind > this (km/h); state untouched; single pass'
        required: false
      only_uid:
        description: 'TEST: only send to this Firebase uid'
        required: false
permissions:
  contents: write
concurrency:
  group: station
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: pip install -q pywebpush
      - name: Poll station, alert, commit
        env:
          HOBOLINK_API_TOKEN: ${{ secrets.HOBOLINK_API_TOKEN }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          FB_BOT_EMAIL: ${{ secrets.FB_BOT_EMAIL }}
          FB_BOT_PASSWORD: ${{ secrets.FB_BOT_PASSWORD }}
          FORCE_THRESHOLD: ${{ github.event.inputs.force_threshold }}
          ONLY_UID: ${{ github.event.inputs.only_uid }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          obs() { python3 -c "import json;print(json.load(open('data/station.json')).get('observed',''))" 2>/dev/null; }
          END=$(( $(date +%s) + 27*60 )); [ -n "$FORCE_THRESHOLD" ] && END=0
          last=$(obs); first=1
          while :; do
            if python3 -u scripts/fetch_station.py; then
              now=$(obs)
              if [ "$now" != "$last" ] || [ $first = 1 ] || [ -n "$FORCE_THRESHOLD" ]; then
                echo "reading $now"
                python3 -u scripts/wind_alert.py || echo "wind alert step failed (continuing)"
                [ -z "$FORCE_THRESHOLD" ] && { python3 -u scripts/humidity_alert.py || echo "humidity alert step failed (continuing)"; }
                git add data/station.json data/station-series.json data/wind-alert-state.json $(ls data/humidity-alert-state.json 2>/dev/null)
                if ! git diff --cached --quiet; then
                  git commit -q -m "Update station conditions"
                  for i in 1 2 3 4 5; do git pull -q --rebase -X theirs && git push -q && break; sleep $((i*7)); done
                fi
                last=$now
              fi
            else echo "fetch failed (will retry)"; fi
            first=0
            [ $(date +%s) -ge $END ] && break
            sleep 150
          done
